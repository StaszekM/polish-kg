services:
  python:
    tty: true
    image: staszekm/polish-kg-python:0.6
    volumes:
      - .:/app:rw
    env_file:
      - .env
    entrypoint: ["/app/docker-entrypoint.sh"]
    # uncomment the following lines to enable GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]